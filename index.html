<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="container">
            <div class="card">
                <div class="card1">
                
                    <h3 style="color: aliceblue; font-size: medium; margin-bottom: 40px;">Your result</h3>
                
                    <div class="circle">
                        <p class="score">76</p>
                        <p style="color: rgba(240, 248, 255,0.3); margin: 0; margin-bottom: 40px;">of 100</p>
                    </div>

                    <h3 style="color: #fff; margin-top: 10px;">Great</h3>
                    <p  style="color: aliceblue; font-size: small;">You scored higher than 65% of the people who have taken these tests</p>
                </div>

                <div class="card2">
                    <div class="container2">
                        <div class="heading">
                            <h3 >Summary</h3>
                            
                        </div>

                        <div class="re">
                            <img class="svg" src="svg images/icon-reaction.svg" alt="">
                            <p>Reaction </p>
                            <p class="font"> <b>80</b> /100</p>
                        </div>

                        <div class="me">
                            <img class="svg" src="svg images/icon-memory.svg" alt="">
                            <p >memory</p>
                            <p class="font"><b>92</b> /100</p>
                        </div>

                        <div class="ver">
                            <img class="svg" src="svg images/icon-verbal.svg" alt="">
                            <p>Verbal</p>
                            <p class="font"> <b>61</b> /100</p>
                        </div>

                        <div class="vis">
                            <img class="svg" src="svg images/icon-visual.svg" alt="">
                            <p>Visual</p>
                            <p class="font"><b>73</b> /100</p>
                        </div>

                        <button>continue</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>>
